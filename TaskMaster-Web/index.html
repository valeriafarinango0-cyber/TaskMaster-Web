<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMaster — Avance 25%</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">&#10003;</span>
        <h1 class="brand-name">TaskMaster</h1>
      </div>
      <nav class="header-nav">
        <button class="nav-btn active" data-view="home">&#127968; Inicio</button>
        <button class="nav-btn" data-view="dashboard">&#128202; Semana</button>
      </nav>
    </div>
  </header>

  <main class="app-main">

    <!-- Vista Inicio -->
    <section id="view-home" class="view active">
      <div class="weekly-bar card">
        <div class="weekly-bar__header">
          <span class="section-label">CARGA DE LA SEMANA</span>
          <span id="carga-badge" class="badge badge--danger">Alta</span>
        </div>
        <div class="weekly-chart" id="weekly-chart"></div>
      </div>
      <div class="filter-row" id="filter-row">
        <button class="chip chip--active" data-filter="todas">Todas</button>
      </div>
      <div class="task-list" id="task-list"></div>
      <button class="fab" id="btn-nueva-tarea" title="Nueva tarea">+</button>
    </section>

    <!-- Vista Dashboard -->
    <section id="view-dashboard" class="view">
      <div class="dashboard-grid">
        <div class="card">
          <h2 class="card-title">&#128202; Tareas por dia y materia</h2>
          <div class="bar-chart" id="bar-chart"></div>
        </div>
        <div class="card">
          <h2 class="card-title">&#127813; Enfoque de la semana</h2>
          <div class="pomodoro-stats" id="pomodoro-stats"></div>
        </div>
        <div class="card">
          <h2 class="card-title">&#128200; Avance por materia</h2>
          <div class="materia-progress" id="materia-progress"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal Nueva/Editar Tarea -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">Nueva Tarea</h2>
        <button class="modal__close" id="btn-cerrar-modal">&#x2715;</button>
      </div>
      <form class="modal__form" id="form-tarea" novalidate>
        <input type="hidden" id="tarea-id" value="" />
        <div class="form-group">
          <label for="tarea-titulo">Titulo *</label>
          <input type="text" id="tarea-titulo" placeholder="Ej: Entregar informe final" required />
          <span class="form-error" id="error-titulo"></span>
        </div>
        <div class="form-group">
          <label for="tarea-descripcion">Descripcion</label>
          <textarea id="tarea-descripcion" rows="3" placeholder="Detalles opcionales..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="tarea-materia">Materia</label>
            <select id="tarea-materia"></select>
          </div>
          <div class="form-group">
            <label for="tarea-prioridad">Prioridad</label>
            <select id="tarea-prioridad">
              <option value="Alta">Alta</option>
              <option value="Media" selected>Media</option>
              <option value="Baja">Baja</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="tarea-fecha">Fecha limite *</label>
            <input type="datetime-local" id="tarea-fecha" required />
            <span class="form-error" id="error-fecha"></span>
          </div>
          <div class="form-group">
            <label for="tarea-pomodoros">Pomodoros estimados</label>
            <input type="number" id="tarea-pomodoros" min="1" max="20" value="2" />
          </div>
        </div>
        <div class="form-group form-group--check">
          <label class="toggle-label">
            <span>Activar recordatorio</span>
            <input type="checkbox" id="tarea-recordatorio" checked />
            <span class="toggle-slider"></span>
          </label>
          <div class="recordatorio-opts" id="recordatorio-opts">
            <select id="tarea-anticipacion">
              <option value="15">15 min antes</option>
              <option value="30" selected>30 min antes</option>
              <option value="60">1 hora antes</option>
              <option value="1440">1 dia antes</option>
            </select>
          </div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn btn--primary" id="btn-guardar">Guardar tarea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Detalle/Pomodoro -->
  <div class="modal-overlay" id="modal-detalle-overlay">
    <div class="modal modal--detalle">
      <div class="modal__header" id="detalle-header">
        <div>
          <span class="detalle-materia-badge" id="detalle-materia"></span>
          <h2 class="modal__title" id="detalle-titulo"></h2>
        </div>
        <button class="modal__close" id="btn-cerrar-detalle">&#x2715;</button>
      </div>
      <div class="detalle-body">
        <p class="detalle-desc" id="detalle-desc"></p>
        <div class="detalle-meta">
          <span id="detalle-fecha"></span>
          <span id="detalle-prioridad"></span>
        </div>
        <div class="pomodoro-section">
          <div class="pomodoro-ring">
            <svg class="pomodoro-svg" viewBox="0 0 120 120">
              <circle class="ring-bg"       cx="60" cy="60" r="50" />
              <circle class="ring-progress"  cx="60" cy="60" r="50" id="ring-progress" />
            </svg>
            <div class="pomodoro-center">
              <span class="pomodoro-time"  id="pomodoro-time">25:00</span>
              <span class="pomodoro-label" id="pomodoro-label">Listo</span>
            </div>
          </div>
          <div class="pomodoro-controls">
            <button class="pom-btn" id="btn-pom-reset">&#x21BA;</button>
            <button class="pom-btn pom-btn--main" id="btn-pom-toggle">&#9654;</button>
            <button class="pom-btn" id="btn-pom-skip">&#9197;</button>
          </div>
          <div class="pomodoro-sessions" id="pomodoro-sessions"></div>
        </div>
        <div class="detalle-actions">
          <button class="btn btn--success" id="btn-completar">&#10003; Completar</button>
          <button class="btn btn--ghost"   id="btn-editar-tarea">Editar</button>
          <button class="btn btn--danger"  id="btn-eliminar-tarea">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- AVANCE 25% — Estructura + HTML + CSS + BD -->
  <!-- Solo modelo y vista basica, sin logica completa -->
  <script src="assets/js/model/MateriaModel.js"></script>
  <script src="assets/js/model/TaskModel.js"></script>
  <script src="assets/js/viewmodel/TaskViewModel.js"></script>
  <script src="assets/js/view/HomeView.js"></script>
  <script src="assets/js/view/DashboardView.js"></script>
  <script src="assets/js/view/ModalView.js"></script>
  <script src="assets/js/view/PomodoroView.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
