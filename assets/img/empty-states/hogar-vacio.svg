<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hogar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#EE5A52;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#hogar-bg)"/>

  <!-- House illustration -->
  <g transform="translate(150, 100)">
    <!-- Roof -->
    <path d="M-40 0L0 -35L40 0Z" fill="#FF6B6B" opacity="0.15" stroke="#FF6B6B" stroke-width="2"/>

    <!-- House body -->
    <rect x="-40" y="0" width="80" height="50" fill="#FF6B6B" opacity="0.08" stroke="#FF6B6B" stroke-width="2"/>

    <!-- Door -->
    <rect x="-8" y="20" width="16" height="30" fill="#FF6B6B" opacity="0.1" stroke="#FF6B6B" stroke-width="1.5"/>
    <circle cx="6" cy="35" r="2" fill="#FF6B6B" opacity="0.4"/>

    <!-- Windows -->
    <rect x="-28" y="8" width="12" height="12" fill="#FF6B6B" opacity="0.05" stroke="#FF6B6B" stroke-width="1.5"/>
    <line x1="-22" y1="8" x2="-22" y2="20" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>
    <line x1="-28" y1="14" x2="-16" y2="14" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>

    <rect x="16" y="8" width="12" height="12" fill="#FF6B6B" opacity="0.05" stroke="#FF6B6B" stroke-width="1.5"/>
    <line x1="22" y1="8" x2="22" y2="20" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>
    <line x1="16" y1="14" x2="28" y2="14" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="150" y="220" font-family="Roboto, sans-serif" font-size="18" font-weight="600"
        text-anchor="middle" fill="#FF6B6B">Sin tareas del hogar</text>
  <text x="150" y="250" font-family="Roboto, sans-serif" font-size="14"
        text-anchor="middle" fill="#999">Organiza las actividades de tu hogar</text>
</svg>