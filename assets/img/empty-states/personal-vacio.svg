<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="personal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB020;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#FF8A00;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#personal-bg)"/>

  <!-- User illustration -->
  <g transform="translate(150, 100)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="18" fill="#FFB020" opacity="0.1" stroke="#FFB020" stroke-width="2"/>

    <!-- Body -->
    <path d="M-20 0C-20 -8 -12 -12 0 -12C12 -12 20 -8 20 0L20 35C20 43 14 50 6 50L-6 50C-14 50 -20 43 -20 35V0Z"
          fill="#FFB020" opacity="0.1" stroke="#FFB020" stroke-width="2"/>

    <!-- Smile indicator -->
    <circle cx="-6" cy="-22" r="2" fill="#FFB020" opacity="0.5"/>
    <circle cx="6" cy="-22" r="2" fill="#FFB020" opacity="0.5"/>
    <path d="M-8 -18Q0 -14 8 -18" stroke="#FFB020" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="150" y="220" font-family="Roboto, sans-serif" font-size="18" font-weight="600"
        text-anchor="middle" fill="#FFB020">Sin tareas personales</text>
  <text x="150" y="250" font-family="Roboto, sans-serif" font-size="14"
        text-anchor="middle" fill="#999">Planifica tus actividades personales</text>
</svg>