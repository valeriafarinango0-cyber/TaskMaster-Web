<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="proyectos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E040FB;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#proyectos-bg)"/>

  <!-- Grid/Projects illustration -->
  <g transform="translate(150, 100)">
    <!-- Top left -->
    <rect x="-35" y="-35" width="26" height="26" rx="2" fill="#E040FB" opacity="0.12" stroke="#E040FB" stroke-width="1.5"/>

    <!-- Top right -->
    <rect x="9" y="-35" width="26" height="26" rx="2" fill="#E040FB" opacity="0.12" stroke="#E040FB" stroke-width="1.5"/>

    <!-- Bottom left -->
    <rect x="-35" y="9" width="26" height="26" rx="2" fill="#E040FB" opacity="0.12" stroke="#E040FB" stroke-width="1.5"/>

    <!-- Bottom right -->
    <rect x="9" y="9" width="26" height="26" rx="2" fill="#E040FB" opacity="0.12" stroke="#E040FB" stroke-width="1.5"/>

    <!-- Connection dots -->
    <circle cx="-22" cy="-9" r="1.5" fill="#E040FB" opacity="0.3"/>
    <circle cx="22" cy="-9" r="1.5" fill="#E040FB" opacity="0.3"/>
    <circle cx="-22" cy="35" r="1.5" fill="#E040FB" opacity="0.3"/>
    <circle cx="22" cy="35" r="1.5" fill="#E040FB" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="150" y="220" font-family="Roboto, sans-serif" font-size="18" font-weight="600"
        text-anchor="middle" fill="#E040FB">Sin proyectos activos</text>
  <text x="150" y="250" font-family="Roboto, sans-serif" font-size="14"
        text-anchor="middle" fill="#999">Crea un nuevo proyecto para empezar</text>
</svg>