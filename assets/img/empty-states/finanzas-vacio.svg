<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="finanzas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#finanzas-bg)"/>

  <!-- Wallet illustration -->
  <g transform="translate(150, 100)">
    <!-- Wallet body -->
    <path d="M-45 -15C-48 -15 -50 -13 -50 -10L-50 25C-50 28 -48 30 -45 30L45 30C48 30 50 28 50 25L50 -10C50 -13 48 -15 45 -15L-45 -15Z"
          fill="#1E88E5" opacity="0.1" stroke="#1E88E5" stroke-width="2"/>

    <!-- Card pocket -->
    <rect x="-40" y="-8" width="35" height="18" rx="2" fill="#1E88E5" opacity="0.05" stroke="#1E88E5" stroke-width="1.5"/>

    <!-- Coin illustration -->
    <circle cx="30" cy="10" r="12" fill="#1E88E5" opacity="0.15" stroke="#1E88E5" stroke-width="2"/>
    <text x="30" y="16" font-size="14" font-weight="bold" text-anchor="middle" fill="#1E88E5" opacity="0.4">$</text>
  </g>

  <!-- Text -->
  <text x="150" y="220" font-family="Roboto, sans-serif" font-size="18" font-weight="600"
        text-anchor="middle" fill="#1E88E5">Sin tareas de finanzas</text>
  <text x="150" y="250" font-family="Roboto, sans-serif" font-size="14"
        text-anchor="middle" fill="#999">Gestiona tus finanzas personales</text>
</svg>